<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f7a3d"><title>Student Profile - EqualLearn</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/equallearn.css"><link rel="icon" href="../assets/icons/icon-192.png"></head><body>
<div class="el-dashboard">
  <div class="el-page-header"><div><div class="el-page-kicker">Account</div><h1>Your profile</h1><p>Keep your learning profile accurate. Email and student number stay protected.</p></div></div>
  <div class="el-profile-hero"><div class="el-profile-avatar" id="profileAvatar">S</div><div><h2 id="profileDisplayName">Student</h2><p id="profileDisplayEmail">Loading account…</p></div></div>
  <form id="studentProfileForm" class="el-grid el-grid-2">
    <article class="el-card"><div class="el-card-title"><h3>Personal information</h3><span>Editable</span></div><div class="el-field"><label for="profileName">Full name</label><input id="profileName" required autocomplete="name"></div><div class="el-field"><label for="profileEmail">Email address</label><input id="profileEmail" type="email" disabled></div><div class="el-field"><label for="profileStudentNumber">Student number</label><input id="profileStudentNumber" disabled></div><div class="el-field"><label for="profileBio">Short bio</label><textarea id="profileBio" maxlength="220" placeholder="A short introduction about yourself"></textarea></div></article>
    <article class="el-card"><div class="el-card-title"><h3>Academic profile</h3><span>Used for class matching</span></div><div class="el-field"><label for="profileCourse">Course</label><input id="profileCourse" placeholder="BSIT"></div><div class="el-field"><label for="profileYear">Year level</label><input id="profileYear" placeholder="1L, 2L, 3L, 4L"></div><div class="el-field"><label for="profileCohort">Cohort</label><input id="profileCohort" placeholder="26"></div><div class="el-form-actions"><button class="el-btn el-btn-primary" type="submit"><span data-icon="save"></span> Save changes</button></div><div id="profileStatus" class="el-form-status"></div></article>
  </form>
</div>
<script type="module" src="../assets/js/student-profile.js"></script><script type="module" src="../assets/js/ui-shell.js"></script><script type="module" src="../assets/js/pwa.js"></script><script type="module" src="../assets/js/theme.js"></script></body></html>
