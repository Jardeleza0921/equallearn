<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f7a3d"><title>Quiz Result - EqualLearn</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/equallearn.css"><link rel="icon" href="../assets/icons/icon-192.png"><style>.result-shell{max-width:680px;margin:auto}.result-score{font-size:clamp(56px,12vw,92px);font-weight:900;letter-spacing:-.05em;color:var(--el-primary);line-height:1}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}@media(max-width:520px){.result-actions{grid-template-columns:1fr}}</style></head><body><div class="el-dashboard result-shell"><article class="el-card" style="text-align:center;padding:clamp(26px,6vw,56px)"><div class="el-stat-icon" style="margin:0 auto 18px"><span data-icon="trophy"></span></div><div class="el-page-kicker">Quiz result</div><div class="result-score" id="score">0%</div><h1 id="resultTitle" style="margin:12px 0 8px">Quiz complete</h1><p id="resultDescription" style="color:var(--el-muted);max-width:480px;margin:0 auto">Your result has been saved to your learning progress.</p><div class="result-actions"><a class="el-btn el-btn-primary" href="quizzes.html"><span data-icon="quiz"></span> More quizzes</a><a class="el-btn el-btn-secondary" href="progress.html"><span data-icon="progress"></span> View progress</a></div></article></div><script>const p=new URLSearchParams(location.search),score=Number(p.get('score')||0),total=Number(p.get('total')||0),pct=Number(p.get('percentage')||(total?Math.round(score/total*100):0)),result=p.get('result')||'';document.getElementById('score').textContent=`${pct}%`;document.getElementById('resultTitle').textContent=result==='passing'?'Passed — well done':'Quiz complete — keep learning';document.getElementById('resultDescription').textContent=`You answered ${score} of ${total} questions correctly. Your latest result is saved in Progress.`;</script><script type="module" src="../assets/js/ui-shell.js"></script><script type="module" src="../assets/js/pwa.js"></script><script type="module" src="../assets/js/theme.js"></script></body></html>
