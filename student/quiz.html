<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz</title>

<link rel="stylesheet"
href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{

background:#ECECFF;
display:flex;
justify-content:center;

}

.phone{

width:100%;
max-width:430px;
min-height:100vh;
background:white;
padding:20px;

}

h2{

color:#6C63FF;
margin-bottom:20px;

}

.question{

font-size:18px;
font-weight:600;
margin-bottom:20px;

}

.choice{

padding:15px;
margin-bottom:12px;
border-radius:12px;
background:#F5F5F5;
cursor:pointer;
transition:.2s;

}

.choice:hover{

background:#6C63FF;
color:white;

}

button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6C63FF;
color:white;
font-size:16px;
font-weight:600;
margin-top:20px;

}

</style>

</head>

<body>

<div class="phone">

<h2>

Quiz

</h2>

<div id="quizContainer">

Loading...

</div>

<button id="nextBtn">

Next

</button>

</div>

<script type="module"
src="../assets/js/quiz.js"></script>

</body>

</html>
