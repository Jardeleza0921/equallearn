name: Build EqualLearn APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run mobile:build-web
      - name: Create Android project
        run: npx cap add android
      - name: Generate app icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#0f7a3d' --iconBackgroundColorDark '#07110b' --splashBackgroundColor '#f3f7f4' --splashBackgroundColorDark '#07110b'
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EqualLearn.apk
      - name: Upload EqualLearn APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EqualLearn
          path: EqualLearn.apk
      - name: Publish direct-download APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="mobile-latest"
            TITLE="EqualLearn Android"
            NOTES="Latest stable EqualLearn Android APK built automatically from the main branch."
          else
            TAG="mobile-preview"
            TITLE="EqualLearn Android Preview"
            NOTES="Latest EqualLearn preview APK built automatically from ${GITHUB_REF_NAME}. This preview opens https://equallearn.netlify.app/."
          fi
          gh release delete "$TAG" --cleanup-tag -y || true
          git tag -f "$TAG"
          git push origin -f "$TAG"
          gh release create "$TAG" EqualLearn.apk \
            --title "$TITLE" \
            --notes "$NOTES"
