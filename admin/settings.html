<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Settings</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="stylesheet"
        href="../assets/css/settings.css">

</head>


<body>

<div class="settings-container">

    <div class="settings-header">

        <div>

            <h1>Settings</h1>

            <p>
                Manage your administrator account.
            </p>

        </div>


        <button
            class="back-btn"
            onclick="window.location.href='dashboard.html'">

            ← Back

        </button>

    </div>


    <div class="settings-card">

        <h2>Account Information</h2>

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                id="fullname"
                type="text"
                placeholder="Full Name">

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                disabled>

        </div>


        <div class="form-group">

            <label>
                Role
            </label>

            <input
                id="role"
                type="text"
                disabled>

        </div>


        <button
            id="saveBtn"
            class="save-btn">

            Save Changes

        </button>

    </div>


    <div class="settings-card">

        <h2>Security</h2>

        <p>
            You can reset your administrator
            password through your registered email.
        </p>


        <button
            id="resetPassword"
            class="reset-btn">

            Reset Password

        </button>

    </div>


</div>


<script
    type="module"
    src="../assets/js/admin-settings.js">
</script>


</body>

</html>
