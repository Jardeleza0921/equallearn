<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">

    <title>Student Reports</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="stylesheet"
        href="../assets/css/reports.css">

    <link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>


<body>

<div class="reports-container">


    <!-- HEADER -->

    <div class="reports-header">

        <div>

            <h1>
                Student Reports
            </h1>

            <p>
                Monitor student grades and school status.
            </p>

        </div>


        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='dashboard.html'">

            ← Back

        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary-grid">


        <div class="summary-card">

            <span>
                Total Students
            </span>

            <strong id="totalStudents">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Passing
            </span>

            <strong
                id="passingStudents"
                class="passing-text">

                0

            </strong>

        </div>


        <div class="summary-card">

            <span>
                Failing
            </span>

            <strong
                id="failingStudents"
                class="failing-text">

                0

            </strong>

        </div>


        <div class="summary-card">

            <span>
                Active Students
            </span>

            <strong id="activeStudents">
                0
            </strong>

        </div>


    </div>


    <!-- FILTERS -->

    <div class="filter-card">


        <input
            type="text"
            id="searchStudent"
            placeholder="Search student name or ID...">


        <select id="courseFilter">

            <option value="">
                All Courses
            </option>

        </select>


        <select id="yearFilter">

            <option value="">
                All Year Levels
            </option>

        </select>


        <select id="resultFilter">

            <option value="">
                All Results
            </option>

            <option value="passing">
                Passing
            </option>

            <option value="failing">
                Failing
            </option>

        </select>


        <select id="statusFilter">

            <option value="">
                All School Status
            </option>

            <option value="active">
                Active
            </option>

            <option value="inactive">
                Inactive
            </option>

        </select>


    </div>


    <!-- REPORT TABLE -->

    <div class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Year Level
                        </th>

                        <th>
                            Grade
                        </th>

                        <th>
                            Result
                        </th>

                        <th>
                            School Status
                        </th>

                    </tr>

                </thead>


                <tbody id="reportsTable">

                    <tr>

                        <td
                            colspan="7"
                            class="loading">

                            Loading reports...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>


<script
    type="module"
    src="../assets/js/admin-reports.js">
</script>


<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
