<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f7a3d">

<title>
Students - EqualLearn
</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#F3F3FF;

    font-family:inherit;

}

.container{

    max-width:1200px;

    margin:auto;

    padding:30px;

}

.header{

    background:#0f7a3d;

    color:white;

    padding:25px;

    border-radius:20px;

    margin-bottom:25px;

}

.header h1{

    margin:0;

}

.back{

    display:inline-block;

    margin-bottom:20px;

    color:#0f7a3d;

    text-decoration:none;

    font-weight:600;

}

.card{

    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);

    overflow-x:auto;

}

.search{

    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:10px;

    margin-bottom:20px;

    font-family:inherit;

}

table{

    width:100%;

    border-collapse:collapse;

    min-width:850px;

}

th{

    background:#F1F0FF;

    color:#444;

    text-align:left;

    padding:14px;

}

td{

    padding:14px;

    border-bottom:1px solid #eee;

}

.status{

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

    background:#DCFCE7;

    color:#166534;

}

.empty{

    text-align:center;

    padding:30px;

    color:#777;

}

.loading{

    text-align:center;

    padding:30px;

}

</style>


<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>


<body>


<div class="container">


<a
href="dashboard.html"
class="back">

← Back to Admin Dashboard

</a>


<div class="header">

<h1>
Registered Students
</h1>

<p>
Admin-only student management
</p>

</div>


<div class="card">


<input
type="text"
id="searchInput"
class="search"
placeholder="Search name, Student ID, email, course...">


<div
id="tableContainer"
class="loading">

Loading students...

</div>


</div>


</div>


<script
type="module"
src="../assets/js/admin-students.js">
</script>


<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
