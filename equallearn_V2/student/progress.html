<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Progress</title>

<link rel="stylesheet"
href="../assets/css/style.css">

<style>

body{

background:#ECECFF;
display:flex;
justify-content:center;

}

.phone{

width:100%;
max-width:430px;
background:white;
min-height:100vh;
padding:25px;

}

.card{

background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:20px;

}

.progress{

width:100%;
height:12px;
background:#eee;
border-radius:10px;
overflow:hidden;
margin-top:15px;

}

.progress span{

display:block;
height:100%;
width:0%;
background:#6C63FF;

}

</style>

</head>

<body>

<div class="phone">

<h2>

Learning Progress

</h2>

<div id="progressContainer">

Loading...

</div>

</div>

<script type="module"
src="../assets/js/progress.js"></script>

</body>

</html>
