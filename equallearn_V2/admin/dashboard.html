<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ECECFF;
display:flex;
justify-content:center;
}

.phone{
width:100%;
max-width:430px;
min-height:100vh;
background:white;
padding:20px;
}

.header{
background:#6C63FF;
color:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
}

.header h2{
font-size:28px;
}

.header p{
margin-top:8px;
opacity:.9;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;
}

.card h1{
font-size:32px;
color:#6C63FF;
}

.card p{
margin-top:8px;
color:#666;
}

.menu{
margin-top:25px;
display:grid;
gap:15px;
}

.menu a{
text-decoration:none;
background:#6C63FF;
color:white;
padding:16px;
border-radius:15px;
text-align:center;
font-weight:600;
}

.logout{
background:#E53935 !important;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<h2>

Admin Panel

</h2>

<p id="adminName">

Loading...

</p>

</div>

<div class="grid">

<div class="card">

<h1 id="teacherCount">

0

</h1>

<p>Teachers</p>

</div>

<div class="card">

<h1 id="studentCount">

0

</h1>

<p>Students</p>

</div>

<div class="card">

<h1 id="moduleCount">

0

</h1>

<p>Modules</p>

</div>

<div class="card">

<h1 id="lessonCount">

0

</h1>

<p>Lessons</p>

</div>

</div>

<div class="menu">

    <a href="register-teacher.html">
    👨‍🏫 Register Teacher
</a>

<a href="manage-teachers.html">

👨‍🏫 Manage Teachers

</a>

<a href="students.html">

👨‍🎓 Manage Students

</a>

<a href="class-assignments.html">
    👥 Class Assignments
</a>

<a href="reports.html">

📊 Reports

</a>

<a href="settings.html">

⚙ Settings

</a>

<a href="../login.html"

class="logout"

id="logout">

🚪 Logout

</a>

</div>

</div>

<script type="module"
src="../assets/js/admin-dashboard.js"></script>

</body>

</html>
