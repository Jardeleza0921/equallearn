<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Class Assignments</title>

    <link
        rel="stylesheet"
        href="../assets/css/class-assignments.css">

</head>

<body>

<div class="page">

    <div class="header">

        <div>
            <h1>Class Assignments</h1>

            <p>
                Assign instructors to classes by year level.
            </p>
        </div>

        <button
            onclick="window.location.href='dashboard.html'"
            class="back-btn">

            ← Back

        </button>

    </div>


    <div class="form-card">

        <h2>Assign Teacher</h2>

        <div class="form-grid">

            <div>

                <label>
                    Class Group
                </label>

                <select id="classGroup">

                    <option value="">
                        Loading classes...
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Year Level
                </label>

                <select id="yearLevel">

                    <option value="">
                        Select Year Level
                    </option>

                    <option value="1L">
                        1L - 1st Year
                    </option>

                    <option value="2L">
                        2L - 2nd Year
                    </option>

                    <option value="3L">
                        3L - 3rd Year
                    </option>

                    <option value="4L">
                        4L - 4th Year
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Teacher
                </label>

                <select id="teacher">

                    <option value="">
                        Loading teachers...
                    </option>

                </select>

            </div>

        </div>


        <button
            id="assignBtn"
            class="assign-btn">

            Assign Teacher

        </button>

        <div id="message"></div>

    </div>


    <div class="table-card">

        <h2>Current Assignments</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Class
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Year Level
                        </th>

                        <th>
                            Teacher
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>

                <tbody id="assignmentList">

                    <tr>

                        <td
                            colspan="5"
                            class="loading">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script
    type="module"
    src="../assets/js/class-assignments.js">
</script>

</body>

</html>
