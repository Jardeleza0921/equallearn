<!DOCTYPE html>
<html lang="en">

<head>

<link
    rel="stylesheet"
    href="assets/css/loading-screen.css">

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Login - EqualLearn V2

</title>

<link
rel="stylesheet"
href="assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.auth-container{

    width:100%;
    max-width:430px;

    height:100vh;

    background:white;

    margin:auto;

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:30px;

}

.auth-title{

    text-align:center;

    color:#6C63FF;

    font-size:34px;

    font-weight:700;

}

.auth-subtitle{

    text-align:center;

    color:#777;

    margin-top:8px;

    margin-bottom:35px;

}

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:8px;

    font-weight:500;

}

.input-group input{

    width:100%;

    padding:15px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:15px;

}

.auth-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#6C63FF;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    margin-top:10px;

}

.auth-btn:hover{

    background:#5449ff;

}

.bottom-link{

    margin-top:25px;

    text-align:center;

}

.bottom-link a{

    text-decoration:none;

    color:#6C63FF;

    font-weight:600;

}

.back-home{

    text-align:center;

    margin-top:15px;

}

.back-home a{

    color:#888;

    text-decoration:none;

}

#message{

    display:none;

    margin-bottom:20px;

    padding:12px;

    border-radius:10px;

    text-align:center;

}

.error{

    display:block !important;

    background:#ffe5e5;

    color:red;

}

.success{

    display:block !important;

    background:#ddffdd;

    color:green;

}

</style>

</head>

<body>

<div class="auth-container">

<h1 class="auth-title">

EqualLearn

</h1>

<p class="auth-subtitle">

Login to continue

</p>

<div id="message"></div>

<form id="loginForm">

<div class="input-group">

<label>

Email

</label>

<input
type="email"
id="email"
required>

</div>

<div class="input-group">

<label>

Password

</label>

<input
type="password"
id="password"
required>

</div>

<button
class="auth-btn"
type="submit">

Login

</button>

</form>

<div class="bottom-link">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

<div class="back-home">

<a href="index.html">

← Back

</a>

</div>

</div>

<script type="module" src="assets/js/login.js"></script>

</body>

</html>
