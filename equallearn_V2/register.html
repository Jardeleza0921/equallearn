<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Register - EqualLearn V2
</title>

<link
rel="stylesheet"
href="assets/css/style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>

.auth-container{

    width:100%;
    max-width:430px;

    min-height:100vh;

    background:white;

    margin:auto;

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:30px;

    box-sizing:border-box;

}

.auth-title{

    text-align:center;

    color:#6C63FF;

    font-size:34px;

    font-weight:700;

}

.auth-subtitle{

    text-align:center;

    color:#777;

    margin-top:8px;

    margin-bottom:20px;

}

.ptc-notice{

    background:#F3F2FF;

    color:#5B54D6;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:12px;

    margin-bottom:25px;

}

.input-group{

    margin-bottom:16px;

}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-weight:500;

}

.input-group input,

.input-group select{

    width:100%;

    padding:13px;

    box-sizing:border-box;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:14px;

    font-family:Poppins;

    outline:none;

}

.input-group input:focus,

.input-group select:focus{

    border-color:#6C63FF;

}

.auth-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#6C63FF;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    margin-top:8px;

}

.auth-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.bottom-link{

    margin-top:22px;

    text-align:center;

}

.bottom-link a{

    text-decoration:none;

    color:#6C63FF;

    font-weight:600;

}

.back-home{

    text-align:center;

    margin-top:15px;

}

.back-home a{

    color:#888;

    text-decoration:none;

}

#message{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:13px;

}

.error{

    display:block !important;

    background:#ffe5e5;

    color:#c00000;

}

.success{

    display:block !important;

    background:#ddffdd;

    color:#087a08;

}

</style>

</head>


<body>


<div class="auth-container">


<h1 class="auth-title">

EqualLearn

</h1>


<p class="auth-subtitle">

Create Student Account

</p>


<div class="ptc-notice">

<strong>PTC Students Only</strong><br>

Use your official Pateros Technological College
institutional email.

</div>


<div id="message"></div>


<form id="registerForm">


<!-- FULL NAME -->

<div class="input-group">

<label>
Full Name
</label>

<input
type="text"
id="fullname"
placeholder="Juan Dela Cruz"
required>

</div>


<!-- STUDENT ID -->

<div class="input-group">

<label>
Student ID
</label>

<input
type="text"
id="studentNumber"
placeholder="23BSIT-0601"
required>

</div>


<!-- EMAIL -->

<div class="input-group">

<label>
Institutional Email
</label>

<input
type="email"
id="email"
placeholder="yourname@paterostechnologicalcollege.edu.ph"
required>

</div>


<!-- YEAR LEVEL -->

<div class="input-group">

<label>
Year Level
</label>

<select
id="yearLevel"
required>

<option value="">
Select Year Level
</option>

<option value="1st Year">
1st Year
</option>

<option value="2nd Year">
2nd Year
</option>

<option value="3rd Year">
3rd Year
</option>

<option value="4th Year">
4th Year
</option>

<option value="5th Year">
5th Year
</option>

</select>

</div>


<!-- COURSE -->

<div class="input-group">

<label>
Course
</label>

<input
type="text"
id="course"
placeholder="BSIT"
required>

</div>


<!-- PASSWORD -->

<div class="input-group">

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Minimum 6 characters"
required>

</div>


<button
class="auth-btn"
type="submit">

Create Account

</button>


</form>


<div class="bottom-link">

Already have an account?

<a href="login.html">

Login

</a>

</div>


<div class="back-home">

<a href="index.html">

← Back

</a>

</div>


</div>


<script
type="module"
src="assets/js/register.js">
</script>


</body>

</html>
