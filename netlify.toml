[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/apk"
  to = "https://github.com/Jardeleza0921/equallearn/releases/download/mobile-preview/EqualLearn.apk"
  status = 302
  force = true
