<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quiz Builder</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ECECFF;
            font-family: Poppins, sans-serif;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 950px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #6C63FF;
        }

        .header p {
            color: #666;
            margin: 5px 0 0;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .back-btn,
        .add-btn {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
        }

        .back-btn {
            background: #dddfff;
            color: #6C63FF;
        }

        .add-btn {
            background: #6C63FF;
            color: white;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .question-card {
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
        }

        .question-number {
            color: #6C63FF;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
        }

        .choices {
            display: grid;
            gap: 8px;
        }

        .choice {
            padding: 10px;
            background: #F6F6FF;
            border-radius: 9px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 9px;
            color: white;
            font-weight: 600;
        }

        .edit-btn {
            background: #2196F3;
        }

        .delete-btn {
            background: #F44336;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: #eee;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            margin-bottom: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group {
            margin-top: 15px;
        }

        .save-btn {
            width: 100%;
            border: none;
            padding: 14px;
            background: #6C63FF;
            color: white;
            border-radius: 10px;
            font-weight: 600;
        }

        @media(max-width:600px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-buttons {
                width: 100%;
            }

            .back-btn,
            .add-btn {
                flex: 1;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>Quiz Builder</h1>

            <p>
                Create and manage quizzes for your lessons.
            </p>

        </div>

        <div class="header-buttons">

            <button
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                ← Back

            </button>

          <button
    id="openModal"
    class="add-question-btn">
    + Add Question
</button>
        </div>

    </div>


    <!-- QUIZ INFORMATION -->

    <div class="card">

        <h2>Quiz Information</h2>

        <div class="form-group">

            <label>
                Lesson
            </label>

            <select id="lessonSelect">

                <option value="">
                    Loading lessons...
                </option>

            </select>

        </div>

    </div>


    <!-- QUESTIONS -->

    <div class="card">

        <h2>Questions</h2>

        <div id="questionList">

            <div class="empty">

                Loading questions...

            </div>

        </div>

    </div>

</div>


<!-- QUESTION MODAL -->

<div
    class="modal"
    id="questionModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Question
            </h2>

            <button
                class="close-btn"
                id="closeModal">

                ×

            </button>

        </div>


        <div class="form-group">

            <label>
                Question
            </label>

            <textarea
                id="questionText"
                placeholder="Enter your question..."></textarea>

        </div>


        <div class="form-group">

            <label>
                Choice A
            </label>

            <input
                id="choiceA"
                placeholder="Choice A">

        </div>


        <div class="form-group">

            <label>
                Choice B
            </label>

            <input
                id="choiceB"
                placeholder="Choice B">

        </div>


        <div class="form-group">

            <label>
                Choice C
            </label>

            <input
                id="choiceC"
                placeholder="Choice C">

        </div>


        <div class="form-group">

            <label>
                Choice D
            </label>

            <input
                id="choiceD"
                placeholder="Choice D">

        </div>


        <div class="form-group">

            <label>
                Correct Answer
            </label>

            <select id="correctAnswer">

                <option value="">
                    Select correct answer
                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

                <option value="D">
                    D
                </option>

            </select>

        </div>


        <button
            class="save-btn"
            id="saveQuestion">

            Save Question

        </button>

    </div>

</div>


<script
    type="module"
    src="../assets/js/quiz-builder.js">
</script>

</body>

</html>
