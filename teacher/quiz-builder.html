<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f7a3d"><title>Quiz Builder - EqualLearn</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/equallearn.css"><link rel="icon" href="../assets/icons/icon-192.png"></head><body>
<div class="el-dashboard"><div class="el-page-header"><div><div class="el-page-kicker">Assessment workspace</div><h1>Quiz Builder</h1><p>Create, review, and edit lesson quizzes without leaving the page.</p></div><button class="el-btn el-btn-primary" id="openQuestionModal"><span data-icon="plus"></span> Add question</button></div>
<section class="el-quiz-summary"><div><strong id="builderQuestionCount">0</strong><span>TOTAL QUESTIONS</span></div><div><strong id="builderQuizCount">0</strong><span>LESSONS WITH QUIZZES</span></div><div><strong id="builderLessonCount">0</strong><span>AVAILABLE LESSONS</span></div></section>
<div class="el-toolbar"><div class="el-search"><span class="el-search-icon" data-icon="search"></span><input id="questionSearch" type="search" placeholder="Search question text"></div><select id="lessonFilter" class="el-select-compact"><option value="">All lessons</option></select></div>
<div id="quizBuilderList"><div class="loading">Loading quiz questions…</div></div></div>
<div class="modal" id="questionModal"><div class="modal-content"><div class="modal-header"><div><div class="el-page-kicker">Question editor</div><h2 id="questionModalTitle">Add Question</h2></div><button class="close-btn" id="questionClose" aria-label="Close">×</button></div><div class="form-group"><label>Lesson</label><select id="questionLesson"></select></div><div class="form-group"><label>Question</label><textarea id="questionText" placeholder="Enter the question"></textarea></div><div class="el-form-grid"><div class="form-group"><label>Choice A</label><input id="choiceA"></div><div class="form-group"><label>Choice B</label><input id="choiceB"></div><div class="form-group"><label>Choice C</label><input id="choiceC"></div><div class="form-group"><label>Choice D</label><input id="choiceD"></div></div><div class="form-group"><label>Correct answer</label><select id="correctAnswer"><option value="">Select answer</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div><div id="questionStatus" class="el-form-status"></div><div class="modal-actions"><button class="cancel-btn" id="questionCancel" type="button">Cancel</button><button class="save-btn" id="questionSave" type="button">Save question</button></div></div></div>
<script type="module" src="../assets/js/quiz-builder.js"></script><script type="module" src="../assets/js/ui-shell.js"></script><script type="module" src="../assets/js/pwa.js"></script><script type="module" src="../assets/js/theme.js"></script></body></html>
