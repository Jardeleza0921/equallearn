<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz Builder</title>

<link rel="stylesheet"
href="../assets/css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ECECFF;
display:flex;
justify-content:center;
}

.phone{
width:100%;
max-width:430px;
min-height:100vh;
background:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h2{
color:#6C63FF;
}

button{
border:none;
cursor:pointer;
}

.addBtn{
background:#6C63FF;
color:white;
padding:12px 18px;
border-radius:12px;
}

.card{
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:15px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
width:90%;
max-width:390px;
padding:20px;
border-radius:15px;
}

select,
textarea,
input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
}

.save{
width:100%;
padding:14px;
background:#6C63FF;
color:white;
border-radius:10px;
}

.delete{
margin-top:10px;
width:100%;
padding:12px;
background:#E53935;
color:white;
border-radius:10px;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<h2>

Quiz Builder

</h2>

<button
id="openModal"
class="addBtn">

+ Question

</button>

</div>

<div id="questionList">

Loading...

</div>

</div>

<div
id="quizModal"
class="modal">

<div class="modal-content">

<h3>

Create Question

</h3>

<select id="lessonSelect">

<option>

Loading lessons...

</option>

</select>

<textarea
id="question"
placeholder="Question"></textarea>

<input id="choiceA" placeholder="Choice A">

<input id="choiceB" placeholder="Choice B">

<input id="choiceC" placeholder="Choice C">

<input id="choiceD" placeholder="Choice D">

<select id="correctAnswer">

<option value="A">Choice A</option>

<option value="B">Choice B</option>

<option value="C">Choice C</option>

<option value="D">Choice D</option>

</select>

<button
id="saveQuestion"
class="save">

Save Question

</button>

</div>

</div>

<script type="module"
src="../assets/js/quiz-builder.js"></script>

</body>

</html>
