<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f7a3d"><title>Teacher Profile - EqualLearn</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/equallearn.css"><link rel="icon" href="../assets/icons/icon-192.png"></head><body>
<div class="el-dashboard"><div class="el-page-header"><div><div class="el-page-kicker">Account</div><h1>Teacher profile</h1><p>Update the information students and administrators use to identify you.</p></div></div>
<div class="el-profile-hero"><div class="el-profile-avatar" id="teacherProfileAvatar">T</div><div><h2 id="teacherProfileDisplay">Teacher</h2><p id="teacherProfileEmail">Loading account…</p></div></div>
<form id="teacherProfileForm" class="el-grid el-grid-2"><article class="el-card"><div class="el-card-title"><h3>Basic information</h3><span>Editable</span></div><div class="el-field"><label>Full name</label><input id="teacherProfileName" required autocomplete="name"></div><div class="el-field"><label>Email address</label><input id="teacherProfileEmailInput" type="email" disabled></div><div class="el-field"><label>Department</label><input id="teacherDepartment" placeholder="Department or program"></div></article><article class="el-card"><div class="el-card-title"><h3>Professional profile</h3><span>Optional</span></div><div class="el-field"><label>Title / position</label><input id="teacherTitle" placeholder="Instructor"></div><div class="el-field"><label>Contact number</label><input id="teacherPhone" inputmode="tel" placeholder="Optional"></div><div class="el-field"><label>Short bio</label><textarea id="teacherBio" maxlength="260" placeholder="Short teaching profile"></textarea></div><div class="el-form-actions"><button class="el-btn el-btn-primary" type="submit"><span data-icon="save"></span> Save profile</button></div><div id="teacherProfileStatus" class="el-form-status"></div></article></form></div>
<script type="module" src="../assets/js/teacher-profile.js"></script><script type="module" src="../assets/js/ui-shell.js"></script><script type="module" src="../assets/js/pwa.js"></script><script type="module" src="../assets/js/theme.js"></script></body></html>
