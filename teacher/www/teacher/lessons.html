<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">

    <title>Manage Lessons</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ECECFF;
            font-family: Poppins, sans-serif;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-left h1 {
            margin: 0;
            color: #6C63FF;
            font-size: 32px;
        }

        .header-left p {
            margin: 6px 0 0;
            color: #666;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .back-btn,
        .add-btn {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .back-btn {
            background: #dddfff;
            color: #6C63FF;
        }

        .add-btn {
            background: #6C63FF;
            color: white;
        }

        .back-btn:hover,
        .add-btn:hover {
            opacity: .9;
        }

        /* LESSON CARD */

        .lesson-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .lesson-card h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .lesson-description {
            color: #666;
            margin: 0 0 15px;
            line-height: 1.6;
        }

        .module-badge {
            display: inline-block;
            background: #F0EFFF;
            color: #6C63FF;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .file-info {
            background: #F7F7FF;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            color: #555;
            font-size: 14px;
        }

        .video-info {
            margin-top: 10px;
            font-size: 14px;
        }

        .video-info a {
            color: #6C63FF;
            text-decoration: none;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-btn {
            background: #2196F3;
        }

        .delete-btn {
            background: #F44336;
        }

        /* EMPTY / LOADING */

        .message-box {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: none;
            background: #eee;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #6C63FF;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .file-help {
            margin-top: 6px;
            font-size: 12px;
            color: #777;
        }

        .upload-status {
            margin-top: 8px;
            font-size: 13px;
            color: #6C63FF;
        }

        .current-file {
            background: #F5F5FF;
            padding: 10px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn,
        .save-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-btn {
            background: #ddd;
            color: #444;
        }

        .save-btn {
            background: #6C63FF;
            color: white;
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 25px 15px 50px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .back-btn,
            .add-btn {
                flex: 1;
            }

            .modal {
                align-items: flex-start;
                padding-top: 30px;
            }

            .modal-content {
                padding: 20px;
            }

        }

    </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header">

        <div class="header-left">

            <h1>Lessons</h1>

            <p>
                Create and manage lessons for your students.
            </p>

        </div>

        <div class="header-buttons">

            <button
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                ← Back

            </button>

            <button
                class="add-btn"
                id="openModal">

                + Add Lesson

            </button>

        </div>

    </div>


    <!-- LESSON LIST -->

    <div id="lessonList">

        <div class="message-box">
            Loading lessons...
        </div>

    </div>

</div>


<!-- ADD / EDIT MODAL -->

<div
    class="modal"
    id="lessonModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Lesson
            </h2>

            <button
                class="close-btn"
                id="closeModal">

                ×

            </button>

        </div>


        <!-- MODULE -->

        <div class="form-group">

            <label for="moduleSelect">
                Module
            </label>

            <select id="moduleSelect">

                <option value="">
                    Loading modules...
                </option>

            </select>

        </div>


        <!-- TITLE -->

        <div class="form-group">

            <label for="lessonTitle">
                Lesson Title
            </label>

            <input
                type="text"
                id="lessonTitle"
                placeholder="Example: What is Gender Equality?">

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="lessonDescription">
                Description
            </label>

            <textarea
                id="lessonDescription"
                placeholder="Enter lesson description..."></textarea>

        </div>


        <!-- FILE -->

        <div class="form-group">

            <label for="lessonFile">
                Lesson File
            </label>

            <input
                type="file"
                id="lessonFile"
                accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png">

            <div class="file-help">

                Supported:
                PDF, Word, PowerPoint, Excel, TXT and images.

            </div>

            <div
                class="current-file"
                id="currentFile"
                style="display:none;">

            </div>

            <div
                class="upload-status"
                id="uploadStatus">

            </div>

        </div>


        <!-- YOUTUBE -->

        <div class="form-group">

            <label for="videoUrl">
                YouTube Link
                <span style="font-weight:400;color:#777;">
                    (Optional)
                </span>
            </label>

            <input
                type="url"
                id="videoUrl"
                placeholder="https://www.youtube.com/watch?v=...">

        </div>


        <!-- ACTIONS -->

        <div class="modal-actions">

            <button
                class="cancel-btn"
                id="cancelBtn">

                Cancel

            </button>

            <button
                class="save-btn"
                id="saveLesson">

                Save Lesson

            </button>

        </div>

    </div>

</div>


<script
    type="module"
    src="../assets/js/teacher-lessons.js">
</script>

<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
