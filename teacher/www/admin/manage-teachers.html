<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">

    <title>Manage Teachers</title>

    <link
        rel="stylesheet"
        href="../assets/css/manage-teachers.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>

<body>

<div class="container">

<h1>Manage Teachers</h1>

<button id="openModal">
➕ Add Teacher
</button>

<button
    type="button"
    class="back-btn"
    onclick="window.location.href='dashboard.html'">
    ← Back
</button>

<div id="teacherList">

Loading...

</div>

</div>

<div class="modal" id="teacherModal">

<div class="modal-content">

<h2 id="modalTitle">

Add Teacher

</h2>

<input
id="fullname"
type="text"
placeholder="Full Name"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<input
id="department"
type="text"
placeholder="Department"
>

<select id="status">

<option value="active">

Active

</option>

<option value="inactive">

Inactive

</option>

</select>

<div class="buttons">

<button id="saveTeacher">

Save

</button>

<button id="cancel">

Cancel

</button>

</div>

</div>

</div>

<script
type="module"
src="../assets/js/admin-teachers.js">
</script>

<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
