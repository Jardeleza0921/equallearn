<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">

    <title>Admin Settings</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="stylesheet"
        href="../assets/css/settings.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>


<body>

<div class="settings-container">

    <div class="settings-header">

        <div>

            <h1>Settings</h1>

            <p>
                Manage your administrator account.
            </p>

        </div>


        <button
            class="back-btn"
            onclick="window.location.href='dashboard.html'">

            ← Back

        </button>

    </div>


    <div class="settings-card">

        <h2>Account Information</h2>

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                id="fullname"
                type="text"
                placeholder="Full Name">

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                disabled>

        </div>


        <div class="form-group">

            <label>
                Role
            </label>

            <input
                id="role"
                type="text"
                disabled>

        </div>


        <button
            id="saveBtn"
            class="save-btn">

            Save Changes

        </button>

    </div>


    <div class="settings-card">
        <h2>Security</h2>
        <p style="color:#6b7280;margin-bottom:20px">Change your password directly, or send a reset link to your registered email.</p>
        <div class="form-group"><label>Current Password</label><input id="currentPassword" type="password" autocomplete="current-password" placeholder="Current password"></div>
        <div class="form-group"><label>New Password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"></div>
        <div class="form-group"><label>Confirm New Password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat new password"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button id="changePassword" class="save-btn">Change Password</button>
          <button id="resetPassword" class="reset-btn">Email Reset Link</button>
        </div>
        <div id="securityMessage" style="margin-top:14px"></div>
    </div>


</div>


<script
    type="module"
    src="../assets/js/admin-settings.js">
</script>


<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
