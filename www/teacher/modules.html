<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">

    <title>Manage Modules</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #ECECFF;

            font-family: 'Poppins', sans-serif;

            color: #222;

        }


        .page {

            width: 100%;

            min-height: 100vh;

            padding: 30px 20px 60px;

        }


        .container {

            width: 100%;

            max-width: 1000px;

            margin: auto;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 25px;

        }


        .header-left h1 {

            margin: 0;

            color: #6C63FF;

            font-size: 34px;

        }


        .header-left p {

            margin: 5px 0 0;

            color: #666;

        }


        .back-btn {

            border: none;

            background: #E3E1FF;

            color: #6C63FF;

            padding: 12px 20px;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

        }


        .back-btn:hover {

            background: #D8D5FF;

        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-btn {

            width: 100%;

            border: none;

            background: #6C63FF;

            color: white;

            padding: 16px;

            border-radius: 14px;

            font-family: inherit;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-bottom: 20px;

        }


        .add-btn:hover {

            background: #574FFF;

        }


        /* =========================
           MODULE CARD
        ========================= */

        .module-card {

            background: white;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 18px;

            box-shadow: 0 6px 20px rgba(0,0,0,.08);

        }


        .module-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

        }


        .module-title {

            margin: 0;

            font-size: 21px;

            font-weight: 700;

        }


        .module-description {

            color: #666;

            line-height: 1.6;

            margin: 10px 0 15px;

        }


        .status {

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;

        }


        .status.active {

            background: #E8F5E9;

            color: #2E7D32;

        }


        .status.draft {

            background: #FFF3E0;

            color: #EF6C00;

        }


        .status.archived {

            background: #EEEEEE;

            color: #666;

        }


        .module-info {

            color: #666;

            font-size: 14px;

            margin: 12px 0;

        }


        /* FILE LINK */

        .file-link {

            display: flex;

            align-items: center;

            gap: 12px;

            background: #F5F5FF;

            padding: 13px;

            border-radius: 12px;

            color: #6C63FF;

            text-decoration: none;

            margin: 15px 0;

        }


        .file-link:hover {

            background: #ECEBFF;

        }


        .file-icon {

            font-size: 25px;

        }


        .file-link small {

            color: #777;

        }


        /* ACTIONS */

        .module-actions {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        .edit-btn,
        .delete-btn {

            flex: 1;

            border: none;

            padding: 12px;

            border-radius: 10px;

            color: white;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

        }


        .edit-btn {

            background: #2196F3;

        }


        .delete-btn {

            background: #F44336;

        }


        .edit-btn:hover {

            background: #1687DD;

        }


        .delete-btn:hover {

            background: #D9362C;

        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty,
        .loading {

            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 18px;

            color: #777;

            box-shadow: 0 5px 20px rgba(0,0,0,.06);

        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.5);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 9999;

        }


        .modal.show {

            display: flex;

        }


        .modal-content {

            width: 100%;

            max-width: 560px;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow: 0 20px 60px rgba(0,0,0,.2);

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .modal-header h2 {

            margin: 0;

            font-size: 23px;

        }


        .close-btn {

            width: 36px;

            height: 36px;

            border: none;

            border-radius: 50%;

            background: #EEEEEE;

            font-size: 20px;

            cursor: pointer;

        }


        .close-btn:hover {

            background: #DDDDDD;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 17px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

        }


        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #D8D8D8;

            border-radius: 10px;

            font-family: inherit;

            font-size: 14px;

            background: white;

        }


        .form-group textarea {

            min-height: 110px;

            resize: vertical;

        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            outline: none;

            border-color: #6C63FF;

            box-shadow: 0 0 0 2px rgba(108,99,255,.1);

        }


        .file-help {

            color: #777;

            font-size: 12px;

            margin-top: 6px;

            line-height: 1.5;

        }


        /* SELECTED FILE */

        #selectedFile {

            display: none;

            margin-top: 12px;

            padding: 12px;

            background: #F5F5FF;

            border-radius: 10px;

            color: #555;

        }


        /* EXISTING FILE */

        #existingFile {

            display: none;

            margin-top: 12px;

            padding: 12px;

            background: #F5F5FF;

            border-radius: 10px;

            color: #555;

        }


        #existingFile a {

            color: #6C63FF;

            text-decoration: none;

            font-weight: 600;

        }


        /* =========================
           UPLOAD PROGRESS
        ========================= */

        #uploadProgress {

            display: none;

            margin-top: 15px;

        }


        .progress-container {

            width: 100%;

            height: 10px;

            background: #EEEEEE;

            border-radius: 10px;

            overflow: hidden;

        }


        #progressBar {

            width: 0%;

            height: 100%;

            background: #6C63FF;

            transition: width .2s ease;

        }


        #progressText {

            margin: 7px 0 0;

            font-size: 13px;

            color: #666;

        }


        /* =========================
           SAVE / CANCEL
        ========================= */

        .save-btn {

            width: 100%;

            border: none;

            background: #6C63FF;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-family: inherit;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

        }


        .save-btn:hover {

            background: #574FFF;

        }


        .save-btn:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .cancel-btn {

            width: 100%;

            border: none;

            background: #999;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;

        }


        .cancel-btn:hover {

            background: #888;

        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            display: none;

            margin-top: 12px;

            padding: 11px;

            border-radius: 9px;

            font-size: 14px;

        }


        .message.success {

            display: block;

            background: #E8F5E9;

            color: #2E7D32;

        }


        .message.error {

            display: block;

            background: #FFEBEE;

            color: #C62828;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .page {

                padding: 20px 15px 50px;

            }


            .header {

                align-items: flex-start;

            }


            .header-left h1 {

                font-size: 28px;

            }


            .back-btn {

                padding: 10px 14px;

            }


            .module-top {

                flex-direction: column;

            }


            .module-actions {

                flex-direction: column;

            }

        }

    </style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="icon" href="../assets/icons/icon-192.png"></head>


<body>


<div class="page">

    <div class="container">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="header-left">

                <h1>
                    Modules
                </h1>

                <p>
                    Manage your learning modules and files.
                </p>

            </div>


            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='dashboard.html'">

                ← Back

            </button>

        </div>


        <!-- =========================
             ADD MODULE
        ========================= -->

        <button
            type="button"
            id="openModal"
            class="add-btn">

            ＋ Add Module

        </button>


        <!-- =========================
             MODULE LIST
        ========================= -->

        <div id="moduleList">

            <div class="loading">

                Loading modules...

            </div>

        </div>


    </div>

</div>



<!-- =====================================================
     ADD / EDIT MODULE MODAL
===================================================== -->

<div
    class="modal"
    id="moduleModal">


    <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">

            <h2 id="modalTitle">

                Add Module

            </h2>


            <button
                type="button"
                id="closeModal"
                class="close-btn">

                ×

            </button>

        </div>


        <!-- MODULE TITLE -->

        <div class="form-group">

            <label for="title">

                Module Title

            </label>


            <input
                type="text"
                id="title"
                placeholder="Example: Introduction to Gender Equality">

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="description">

                Description

            </label>


            <textarea
                id="description"
                placeholder="Enter module description..."></textarea>

        </div>


        <!-- DISPLAY ORDER -->

        <div class="form-group">

            <label for="moduleOrder">

                Display Order

            </label>


            <input
                type="number"
                id="moduleOrder"
                min="1"
                placeholder="Example: 1">

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label for="moduleStatus">

                Status

            </label>


            <select id="moduleStatus">

                <option value="active">
                    Active
                </option>

                <option value="draft">
                    Draft
                </option>

                <option value="archived">
                    Archived
                </option>

            </select>

        </div>


        <!-- MODULE FILE -->

        <div class="form-group">

            <label for="moduleFile">

                Module File

            </label>


            <input
                type="file"
                id="moduleFile"
                accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.png,.jpg,.jpeg,.webp">


            <div class="file-help">

                Supported files:
                PDF, Word, PowerPoint, Excel, TXT and images.

                <br>

                Maximum file size: 20 MB.

            </div>


            <!-- SELECTED FILE -->

            <div id="selectedFile">

            </div>


            <!-- EXISTING FILE -->

            <div id="existingFile">

            </div>


            <!-- UPLOAD PROGRESS -->

            <div id="uploadProgress">


                <div class="progress-container">

                    <div id="progressBar">

                    </div>

                </div>


                <p id="progressText">

                    Uploading...

                </p>


            </div>

        </div>


        <!-- SAVE -->

        <button
            type="button"
            id="saveModule"
            class="save-btn">

            Save Module

        </button>


        <!-- CANCEL -->

        <button
            type="button"
            id="cancelEdit"
            class="cancel-btn">

            Cancel

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="../assets/js/teacher-modules.js">
</script>


<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script></body>

</html>
